    <script>
      (() => {
        if (!['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname)) return;
        const NativeWebSocket = window.WebSocket;
        window.WebSocket = class extends NativeWebSocket {
          constructor(url, protocols) {
            if (protocols === undefined) super(url);
            else super(url, protocols);
            const target = new URL(url, location.href);
            if (target.host !== location.host || !target.pathname.endsWith('/ws')) return;
            this.addEventListener('message', event => {
              if (event.data === 'reload' || event.data === 'refreshcss') event.stopImmediatePropagation();
            });
          }
        };
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/components/Loading/Loading.css" />
    <script>
      (() => {
      const navigation = performance.getEntriesByType('navigation')[0]?.type;
      let visited = false;
      try { visited = sessionStorage.getItem('portfolio-loading-seen') === '1'; } catch {}
      window.__portfolioShouldLoad = !visited && navigation !== 'reload' && navigation !== 'back_forward';
      if (!window.__portfolioShouldLoad) return;
      try { sessionStorage.setItem('portfolio-loading-seen', '1'); } catch {}
      document.documentElement.classList.add('portfolio-loading');
      window.__portfolioLoadingFallback = setTimeout(() => {
        document.documentElement.classList.remove('portfolio-loading', 'portfolio-loading--revealing');
        document.querySelector('.portfolio-loader')?.remove();
        const content = document.querySelector('#root');
        if (content) content.inert = false;
      }, 22000);
      })();
    </script>
